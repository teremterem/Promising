[tool.ruff]
line-length = 119
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "PL"]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
branch = true
source = ["promising"]

[project]
name = "promising"
version = "0.0.1"
description = """\
TODO\
"""
authors = [{name = "Oleksandr Tereshchenko", email = "toporok@gmail.com"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10,<4.0"
dependencies = []

[project.optional-dependencies]
dev = [
    "hatch",
    "ipython",
    # "jupyterlab",
    # "notebook",  # This is needed for notebooks to work in PyCharm
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-dotenv",
    "python-dotenv",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
